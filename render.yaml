# Render blueprint: the whole app (API + frontend) as one service.
# Deploy: push this repo to GitHub, then Render dashboard > New > Blueprint.
services:
  - type: web
    name: qrip
    runtime: python
    plan: free
    # QRIP itself is standard library only; this installs the Anthropic SDK
    # that functions 1 and 2 use for coding and theme reasoning.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Signs auth tokens. Without it a key file is used, which is lost on every
      # deploy, signing everyone out.
      - key: QRIP_SECRET
        generateValue: true

      # ---------------------------------------------------------------------
      # DATA PERSISTENCE — READ THIS
      #
      # Render's free plan cannot mount a disk, so on `plan: free` the SQLite
      # database lives on the container's ephemeral filesystem and is WIPED on
      # every deploy and every restart (including the daily free-tier restart).
      # Fine for a demo; not fine for real projects.
      #
      # To keep data, upgrade the instance and uncomment BOTH blocks below:
      #   1. change `plan: free` above to `plan: starter`
      #   2. uncomment the QRIP_DATA_DIR variable
      #   3. uncomment the `disk:` block at the bottom
      # ---------------------------------------------------------------------
      # - key: QRIP_DATA_DIR
      #   value: /var/qrip

      # Only needed if the frontend is hosted somewhere else (e.g. Netlify)
      # AND you are not proxying /api through it.
      # - key: QRIP_ALLOWED_ORIGINS
      #   value: https://your-site.netlify.app

      # Optional review providers for Google Maps URLs:
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: SERPAPI_KEY
      #   sync: false
      # - key: OUTSCRAPER_KEY
      #   sync: false

      # REQUIRED for the quality this tool is built for. Functions 1 and 2
      # (review coding and theme reasoning) use Claude Opus 5. Without this
      # key they fall back to a lexicon that matches words rather than
      # meaning. `sync: false` means Render prompts you for the value on
      # deploy rather than storing it in this file.
      - key: ANTHROPIC_API_KEY
        sync: false

    # Paid instances only — see the note above.
    # disk:
    #   name: qrip-data
    #   mountPath: /var/qrip
    #   sizeGB: 1
