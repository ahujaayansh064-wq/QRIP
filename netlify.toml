# Netlify hosts the frontend only — it cannot run the Python API.
# Deploy the API somewhere that runs a process (see render.yaml), then either:
#   a) set the backend address in frontend/index.html's <meta name="qrip-api-base">,
#      and set QRIP_ALLOWED_ORIGINS on the backend to this site's URL; or
#   b) leave the meta tag empty and use the /api proxy below, which keeps the
#      browser on one origin and avoids CORS entirely.

[build]
  publish = "frontend"
  command = "echo 'No build step: the frontend is plain ES modules.'"

# (b) Proxy the API through Netlify. Replace the host with your backend's URL.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-ME.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
